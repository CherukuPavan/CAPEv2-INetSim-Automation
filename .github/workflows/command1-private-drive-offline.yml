name: Command 1 private Drive crypt golden-master transfer offline

on:
  push:
    branches: [development]
    paths:
      - "scripts/command1_private_drive_bundle.py"
      - "scripts/test_command1_private_drive_bundle.py"
      - "scripts/command1_export_existing_master.py"
      - "docs/COMMAND1_PRIVATE_DRIVE_TRANSFER.md"
      - ".github/workflows/command1-private-drive-offline.yml"
  pull_request:
    branches: [development]
    paths:
      - "scripts/command1_private_drive_bundle.py"
      - "scripts/test_command1_private_drive_bundle.py"
      - ".github/workflows/command1-private-drive-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypt-transfer-synthetic:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax verify private crypt bundle transport
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for leaf in ("command1_private_drive_bundle.py",
                       "test_command1_private_drive_bundle.py"):
              path = Path("scripts") / leaf
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print("SYNTAX_OK", path)
          PY
      - name: Test private Drive transfer without Google credentials
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest discover -s scripts -p 'test_command1_private_drive_bundle.py' -v
      - name: Confirm no public plaintext Drive fallback or VM actions
        run: |
          python -B - <<'PY'
          from pathlib import Path
          code = Path("scripts/command1_private_drive_bundle.py").read_text()
          for banned in ("shell=True", "rclone sync", "virsh start",
                         "snapshot-revert", "systemctl restart", "os.system(",
                         "subprocess.Popen("):
              assert banned not in code, banned
          print("PRIVATE_CRYPT_ONLY_NO_VM_MUTATION_PASS")
          PY
