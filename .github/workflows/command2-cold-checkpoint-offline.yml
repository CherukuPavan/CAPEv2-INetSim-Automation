      - "scripts/test_command2_ssl55_network_readonly_audit.py"
      - "scripts/command2_portable_zero_nic_stager.py"
      - "scripts/test_command2_portable_zero_nic_stager.py"
      - "scripts/command2_portable_zero_nic_xml.py"
