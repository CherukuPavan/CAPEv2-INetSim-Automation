      - "scripts/command2_portable_identity_allocator.py"
      - "scripts/test_command2_portable_identity_allocator.py"
      - "scripts/command2_target_host_preflight_offline_acceptance.sh"
      - "scripts/command2_setup_auto_report_sync.sh"
      - "scripts/command2_upload_approved_reports.sh"
      - "scripts/test_command2_upload_approved_reports.py"
