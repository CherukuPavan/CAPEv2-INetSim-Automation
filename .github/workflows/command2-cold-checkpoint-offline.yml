  windows-powershell-syntax:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse BOTH Windows guest scripts without executing either
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/command2_guest_personalize.ps1',
            'scripts/command2_guest_startup_autoconfig.ps1',
            'scripts/command2_guest_one_nic_firstboot.ps1',
            'scripts/command2_windows_one_nic_diagnostic.ps1',
            'scripts/command2_ssl55_win11_1_oneclick_guest_fix.ps1',
            'scripts/command2_guest_benign_egress_probe.ps1',
            'scripts/command2_guest_benign_egress_probe_v2.ps1',
            'scripts/command2_windows_benign_snapshot_witness.ps1'
          )
          foreach ($scriptName in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptName),
              [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw ('PowerShell guest script syntax invalid: ' + $scriptName)
            }
            Write-Output ('WINDOWS_POWERSHELL_SYNTAX_PASS_NO_GUEST_OPERATIONS ' + $scriptName)
          }
