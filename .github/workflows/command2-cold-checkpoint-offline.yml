      - "scripts/command2_cold_and_count_plan_acceptance.sh"
      - ".github/workflows/command2-cold-checkpoint-offline.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |-
          bash -n scripts/command2_cold_checkpoint_plan_acceptance.sh
          bash -n scripts/command2_cold_and_count_plan_acceptance.sh
          bash -n scripts/command2_target_host_preflight_offline_acceptance.sh
          bash -n scripts/command2_setup_auto_report_sync.sh
          bash -n scripts/command2_upload_approved_reports.sh
      - name: Python 3.10 offline mocks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_cold_checkpoint*.py' -v
      - name: Python 3.10 existing-clone planner tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_continuation_plan.py' -v
      - name: Python 3.10 reference-host staging guard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_stage_independent_clones.py' -v
      - name: Python 3.10 fresh-machine count model tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_portable_fresh_count_plan.py' -v
      - name: Python 3.10 target host preflight tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_target_host_preflight.py' -v
      - name: Python 3.10 portable identity allocator tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_portable_identity_allocator.py' -v
      - name: Python 3.10 candidate guest identity blueprint tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_guest_identity_blueprint.py' -v
      - name: Python 3.10 private identity journal regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_identity_reservation_journal.py' -v
      - name: Python 3.10 portable zero-NIC XML rendering tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_portable_zero_nic_xml.py' -v
      - name: Python 3.10 portable zero-NIC real staging refusal mocks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_portable_zero_nic_stager.py' -v
      - name: Python 3.10 SSL-55 network read-only audit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_ssl55_network_readonly_audit.py' -v
      - name: Python 3.10 integrated Command 2 count frontend mocks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_portable_zero_nic_entrypoint.py' -v
      - name: Python 3.10 Windows guest personalization config tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_windows_guest_config.py' -v
      - name: Python 3.10 portable provisioning stage gate tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_portable_sequence_model.py' -v
      - name: Python 3.10 mock Drive auto-upload safety tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_upload_approved_reports.py' -v
      - name: Python 3.10 peer collision guard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3.10 -B -m unittest discover -s scripts -p 'test_command2_shared_artifacts.py' -v
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 3.12 offline mocks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_cold_checkpoint*.py' -v
      - name: Python 3.12 existing-clone planner tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_continuation_plan.py' -v
      - name: Python 3.12 reference-host staging guard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_stage_independent_clones.py' -v
      - name: Python 3.12 fresh-machine count model tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_portable_fresh_count_plan.py' -v
      - name: Python 3.12 target host preflight tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_target_host_preflight.py' -v
      - name: Python 3.12 portable identity allocator tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_portable_identity_allocator.py' -v
      - name: Python 3.12 candidate guest identity blueprint tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_guest_identity_blueprint.py' -v
      - name: Python 3.12 private identity journal regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_identity_reservation_journal.py' -v
      - name: Python 3.12 portable zero-NIC XML rendering tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_portable_zero_nic_xml.py' -v
      - name: Python 3.12 portable zero-NIC real staging refusal mocks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_portable_zero_nic_stager.py' -v
      - name: Python 3.12 SSL-55 network read-only audit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_ssl55_network_readonly_audit.py' -v
      - name: Python 3.12 integrated Command 2 count frontend mocks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_portable_zero_nic_entrypoint.py' -v
      - name: Python 3.12 Windows guest personalization config tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_windows_guest_config.py' -v
      - name: Python 3.12 portable provisioning stage gate tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_portable_sequence_model.py' -v
      - name: Python 3.12 mock Drive auto-upload safety tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_upload_approved_reports.py' -v
      - name: Python 3.12 peer collision guard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s scripts -p 'test_command2_shared_artifacts.py' -v

  windows-powershell-syntax:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse Windows guest personalization script without running it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/command2_guest_personalize.ps1'),
            [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell guest script syntax invalid'
          }
          Write-Output 'WINDOWS_POWERSHELL_SYNTAX_PASS_NO_GUEST_OPERATIONS'

