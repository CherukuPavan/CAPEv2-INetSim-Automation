  windows-powershell-syntax:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse BOTH Windows guest scripts without executing either
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/command2_guest_personalize.ps1',
            'scripts/command2_guest_startup_autoconfig.ps1'
          )
          foreach ($scriptName in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptName),
              [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw ('PowerShell guest script syntax invalid: ' + $scriptName)
            }
            Write-Output ('WINDOWS_POWERSHELL_SYNTAX_PASS_NO_GUEST_OPERATIONS ' + $scriptName)
          }
