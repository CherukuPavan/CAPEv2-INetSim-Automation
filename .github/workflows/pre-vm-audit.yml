permissions:
  contents: read

jobs:
  syntax-and-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python module (syntax only)
        run: python3 -m py_compile scripts/audit_pre_vm_stages.py scripts/test_audit_pre_vm_stages.py scripts/install_cape_optional_deps.py scripts/test_install_cape_optional_deps.py scripts/audit_upstream_installers.py scripts/test_audit_upstream_installers.py scripts/inspect_windows_media.py scripts/test_inspect_windows_media.py scripts/audit_windows_vm_preflight.py scripts/test_audit_windows_vm_preflight.py scripts/guard_vm_backing_access.py scripts/test_guard_vm_backing_access.py scripts/audit_clone_master.py scripts/test_audit_clone_master.py scripts/plan_vm_clones.py scripts/test_plan_vm_clones.py scripts/export_cold_master_disk.py scripts/test_export_cold_master_disk.py scripts/personalize_clone_windows.py scripts/test_personalize_clone_windows.py scripts/command2_clone_vms.py scripts/clone_domain_xml.py scripts/test_clone_domain_xml.py scripts/register_cape_clones.py scripts/verify_clone_agent.py scripts/test_verify_clone_agent.py scripts/test_command2_clone_vms.py scripts/guard_vm_tpm_socket.py scripts/test_guard_vm_tpm_socket.py scripts/test_command2_lifecycle.py scripts/command1_master_checkpoint.py scripts/test_command1_master_checkpoint.py scripts/audit_command12_acceptance.py scripts/test_audit_command12_acceptance.py scripts/inspect_standalone_windows_hive.py scripts/test_inspect_standalone_windows_hive.py scripts/probe_cold_windows_volume_crypto.py scripts/test_probe_cold_windows_volume_crypto.py scripts/audit_win11_bitlocker_working_overlay.py scripts/test_audit_win11_bitlocker_working_overlay.py scripts/prepare_win11_bitlocker_working_overlay.py scripts/test_prepare_win11_bitlocker_working_overlay.py scripts/plan_win11_maintenance_xml.py scripts/test_plan_win11_maintenance_xml.py scripts/drill_win11_offline_definition_restore.py scripts/test_drill_win11_offline_definition_restore.py scripts/export_decrypted_maintenance_template.py scripts/test_export_decrypted_maintenance_template.py scripts/inspect_decrypted_template_network.py scripts/test_inspect_decrypted_template_network.py
      - name: Run isolated unit tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_audit_pre_vm_stages.py' -v
          python3 -m unittest discover -s scripts -p 'test_install_cape_optional_deps.py' -v
          python3 -m unittest discover -s scripts -p 'test_audit_upstream_installers.py' -v
          python3 -m unittest discover -s scripts -p 'test_inspect_windows_media.py' -v
          python3 -m unittest discover -s scripts -p 'test_audit_windows_vm_preflight.py' -v
          python3 -m unittest discover -s scripts -p 'test_guard_vm_backing_access.py' -v
          python3 -m unittest discover -s scripts -p 'test_audit_clone_master.py' -v
          python3 -m unittest discover -s scripts -p 'test_audit_command12_acceptance.py' -v
          python3 -m unittest discover -s scripts -p 'test_command1_master_checkpoint.py' -v
          python3 -m unittest discover -s scripts -p 'test_plan_vm_clones.py' -v
          python3 -m unittest discover -s scripts -p 'test_clone_domain_xml.py' -v
          python3 -m unittest discover -s scripts -p 'test_command2_clone_vms.py' -v
          python3 -m unittest discover -s scripts -p 'test_command2_lifecycle.py' -v
          python3 -m unittest discover -s scripts -p 'test_guard_vm_tpm_socket.py' -v
          python3 -m unittest discover -s scripts -p 'test_verify_clone_agent.py' -v
          python3 -m unittest discover -s scripts -p 'test_personalize_clone_windows.py' -v
          python3 -m unittest discover -s scripts -p 'test_inspect_standalone_windows_hive.py' -v
          python3 -m unittest discover -s scripts -p 'test_probe_cold_windows_volume_crypto.py' -v
          python3 -m unittest discover -s scripts -p 'test_audit_win11_bitlocker_working_overlay.py' -v
          python3 -m unittest discover -s scripts -p 'test_prepare_win11_bitlocker_working_overlay.py' -v
          python3 -m unittest discover -s scripts -p 'test_plan_win11_maintenance_xml.py' -v
          python3 -m unittest discover -s scripts -p 'test_drill_win11_offline_definition_restore.py' -v
          python3 -m unittest discover -s scripts -p 'test_export_decrypted_maintenance_template.py' -v
          python3 -m unittest discover -s scripts -p 'test_inspect_decrypted_template_network.py' -v
          python3 -m unittest discover -s scripts -p 'test_export_cold_master_disk.py' -v
      - name: Bash syntax only
        run: |
          bash -n scripts/bootstrap_pre_vm_prereqs.sh
          bash -n scripts/command1_pre_vm.sh
          bash -n scripts/command2_clone_vms.sh
          bash -n scripts/plan_guestfs_dependency_impact.sh
          bash -n scripts/plan_minimal_hivex_backend.sh
          bash -n scripts/install_minimal_hivex_guarded.sh
          bash -n scripts/bootstrap_virtualization_stack.sh
          bash -n scripts/diagnose_swtpm_startup.sh
          bash -n scripts/audit_swtpm_localca_access.sh
          bash -n scripts/repair_swtpm_localca_owner.sh
          bash -n scripts/audit_swtpm_socket_access.sh
          bash -n scripts/audit_swtpm_socket_security.sh
          bash -n scripts/probe_swtpm_socket_start_once.sh
          bash -n scripts/guarded_win11_tpm_apparmor_rule.sh
          bash -n scripts/probe_qemu_caps_start_once.sh
          bash -n scripts/audit_libvirt_apparmor_includes.sh
          bash -n scripts/audit_win11_installed_definition.sh
      - name: No accidental host provisioning during tests
        run: |
          echo 'The CI suite is offline-only; no apt, pip, libvirt or malware execution.'
