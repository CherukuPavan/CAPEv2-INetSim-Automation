name: Pre-VM automation offline checks
on:
  push:
    branches: [development]
    paths:
      - 'scripts/audit_pre_vm_stages.py'
      - 'scripts/test_audit_pre_vm_stages.py'
      - 'scripts/bootstrap_pre_vm_prereqs.sh'
      - 'scripts/command1_pre_vm.sh'
      - 'scripts/bootstrap_virtualization_stack.sh'
      - 'scripts/install_cape_optional_deps.py'
      - 'scripts/test_install_cape_optional_deps.py'
      - 'scripts/audit_upstream_installers.py'
      - 'scripts/test_audit_upstream_installers.py'
      - 'scripts/inspect_windows_media.py'
      - 'scripts/test_inspect_windows_media.py'
      - 'scripts/audit_windows_vm_preflight.py'
      - 'scripts/test_audit_windows_vm_preflight.py'
      - 'scripts/diagnose_swtpm_startup.sh'
      - 'scripts/audit_swtpm_localca_access.sh'
      - 'scripts/repair_swtpm_localca_owner.sh'
      - 'scripts/audit_swtpm_socket_access.sh'
      - 'scripts/audit_swtpm_socket_security.sh'
      - 'scripts/probe_swtpm_socket_start_once.sh'
      - 'scripts/guarded_win11_tpm_apparmor_rule.sh'
      - 'scripts/probe_qemu_caps_start_once.sh'
      - '.github/workflows/pre-vm-audit.yml'
  pull_request:
    paths:
      - 'scripts/audit_pre_vm_stages.py'
      - 'scripts/test_audit_pre_vm_stages.py'
      - 'scripts/bootstrap_pre_vm_prereqs.sh'
      - 'scripts/command1_pre_vm.sh'
      - 'scripts/bootstrap_virtualization_stack.sh'
      - 'scripts/install_cape_optional_deps.py'
      - 'scripts/test_install_cape_optional_deps.py'
      - 'scripts/audit_upstream_installers.py'
      - 'scripts/test_audit_upstream_installers.py'
      - 'scripts/inspect_windows_media.py'
      - 'scripts/test_inspect_windows_media.py'
      - 'scripts/audit_windows_vm_preflight.py'
      - 'scripts/test_audit_windows_vm_preflight.py'
      - 'scripts/diagnose_swtpm_startup.sh'
      - 'scripts/audit_swtpm_localca_access.sh'
      - 'scripts/repair_swtpm_localca_owner.sh'
      - 'scripts/audit_swtpm_socket_access.sh'
      - 'scripts/audit_swtpm_socket_security.sh'
      - 'scripts/probe_swtpm_socket_start_once.sh'
      - 'scripts/guarded_win11_tpm_apparmor_rule.sh'
      - 'scripts/probe_qemu_caps_start_once.sh'
      - '.github/workflows/pre-vm-audit.yml'

permissions:
  contents: read

jobs:
  syntax-and-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python module (syntax only)
        run: python3 -m py_compile scripts/audit_pre_vm_stages.py scripts/test_audit_pre_vm_stages.py scripts/install_cape_optional_deps.py scripts/test_install_cape_optional_deps.py scripts/audit_upstream_installers.py scripts/test_audit_upstream_installers.py scripts/inspect_windows_media.py scripts/test_inspect_windows_media.py scripts/audit_windows_vm_preflight.py scripts/test_audit_windows_vm_preflight.py
      - name: Run isolated unit tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_audit_pre_vm_stages.py' -v
          python3 -m unittest discover -s scripts -p 'test_install_cape_optional_deps.py' -v
          python3 -m unittest discover -s scripts -p 'test_audit_upstream_installers.py' -v
          python3 -m unittest discover -s scripts -p 'test_inspect_windows_media.py' -v
          python3 -m unittest discover -s scripts -p 'test_audit_windows_vm_preflight.py' -v
      - name: Bash syntax only
        run: |
          bash -n scripts/bootstrap_pre_vm_prereqs.sh
          bash -n scripts/command1_pre_vm.sh
          bash -n scripts/bootstrap_virtualization_stack.sh
          bash -n scripts/diagnose_swtpm_startup.sh
          bash -n scripts/audit_swtpm_localca_access.sh
          bash -n scripts/repair_swtpm_localca_owner.sh
          bash -n scripts/audit_swtpm_socket_access.sh
          bash -n scripts/audit_swtpm_socket_security.sh
          bash -n scripts/probe_swtpm_socket_start_once.sh
          bash -n scripts/guarded_win11_tpm_apparmor_rule.sh
          bash -n scripts/probe_qemu_caps_start_once.sh
      - name: No accidental host provisioning during tests
        run: |
          echo 'The CI suite is offline-only; no apt, pip, libvirt or malware execution.'
