name: Pre-VM automation offline checks
on:
  push:
    branches: [development]
    paths:
      - 'scripts/audit_pre_vm_stages.py'
      - 'scripts/test_audit_pre_vm_stages.py'
      - 'scripts/bootstrap_pre_vm_prereqs.sh'
      - 'scripts/command1_pre_vm.sh'
      - 'scripts/bootstrap_virtualization_stack.sh'
      - 'scripts/install_cape_optional_deps.py'
      - 'scripts/test_install_cape_optional_deps.py'
      - '.github/workflows/pre-vm-audit.yml'
  pull_request:
    paths:
      - 'scripts/audit_pre_vm_stages.py'
      - 'scripts/test_audit_pre_vm_stages.py'
      - 'scripts/bootstrap_pre_vm_prereqs.sh'
      - 'scripts/command1_pre_vm.sh'
      - 'scripts/bootstrap_virtualization_stack.sh'
      - 'scripts/install_cape_optional_deps.py'
      - 'scripts/test_install_cape_optional_deps.py'
      - '.github/workflows/pre-vm-audit.yml'

permissions:
  contents: read

jobs:
  syntax-and-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python module (syntax only)
        run: python3 -m py_compile scripts/audit_pre_vm_stages.py scripts/test_audit_pre_vm_stages.py scripts/install_cape_optional_deps.py scripts/test_install_cape_optional_deps.py
      - name: Run isolated unit tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_audit_pre_vm_stages.py' -v
          python3 -m unittest discover -s scripts -p 'test_install_cape_optional_deps.py' -v
      - name: Bash syntax only
        run: |
          bash -n scripts/bootstrap_pre_vm_prereqs.sh
          bash -n scripts/command1_pre_vm.sh
          bash -n scripts/bootstrap_virtualization_stack.sh      - name: No accidental host provisioning during tests
        run: |
          echo 'The CI suite is offline-only; no apt, pip, libvirt or malware execution.'
