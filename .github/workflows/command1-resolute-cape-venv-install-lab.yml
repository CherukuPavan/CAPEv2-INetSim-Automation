name: Real pinned CAPEv2 dependency install in isolated Python3.12 Ubuntu26 CI

on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/command1-resolute-cape-venv-install-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-python312-cape:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Try actual pinned CAPE Python package environment without host service or guest
        env:
          DEBIAN_FRONTEND: noninteractive
          UV_PYTHON_INSTALL_DIR: /tmp/cape-python-versions
          UV_PYTHON_INSTALL_BIN: "0"
          UV_NO_CACHE: "1"
          UPSTREAM_REV: 004d73c51dcd12dacb97b3657262bdea8376d710
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 26.04
          apt-get update -o APT::Get::Update::Error-Mode=any
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git ca-certificates \
            build-essential cmake pkg-config libssl-dev libffi-dev \
            zlib1g-dev libjpeg-dev libmagic-dev libfuzzy-dev libyara-dev \
            libpq-dev libxml2-dev libxslt1-dev
          python3 -m venv /tmp/cape-uv-tool
          /tmp/cape-uv-tool/bin/python -m pip install --only-binary=:all: "uv==0.9.15"
          /tmp/cape-uv-tool/bin/uv python install "3.12.12" --no-bin
          /tmp/cape-uv-tool/bin/uv venv --managed-python --python "3.12.12" /tmp/cape-py312
          git clone -q --filter=blob:none --no-checkout https://github.com/kevoreilly/CAPEv2.git /tmp/cape-upstream
          git -C /tmp/cape-upstream checkout -q --detach "$UPSTREAM_REV"
          test "$(git -C /tmp/cape-upstream rev-parse HEAD)" = "$UPSTREAM_REV"
          # Run SDist builders only in this disposable no-secrets runner:
          # install into /tmp/cape-py312, NEVER default Python3.14 or /opt/CAPE.
          # CAPE's pyproject declares package-mode=false in Poetry.
          # Editable CAPE install is deliberately invalid; install just the
          # exact pinned dependency graph from PEP-621 metadata instead.
          /tmp/cape-uv-tool/bin/uv pip compile \
              --python /tmp/cape-py312/bin/python \
              --generate-hashes \
              --output-file /tmp/cape-cp312-resolved.txt \
              /tmp/cape-upstream/pyproject.toml
          /tmp/cape-uv-tool/bin/uv pip install \
              --python /tmp/cape-py312/bin/python \
              --requirement /tmp/cape-cp312-resolved.txt
          /tmp/cape-py312/bin/python - <<'PY'
          import sys
          import gevent, greenlet, django, sqlalchemy, yara
          assert sys.version_info[:2] == (3,12)
          assert gevent.__version__ == '24.2.1'
          assert greenlet.__version__ == '3.0.3'
          print("PINNED_CAPE_CORE_NATIVE_DEPENDENCIES_INSTALLED_AND_IMPORTED")
          PY
          test "$(python3 --version)" = "Python 3.14.4"
          # Import-level smoke test executes CAPE's actual CLI --help as
          # an unprivileged account. It does not start a CAPE scheduler,
          # virtual machine, rooter, web service, or malware analysis.
          test -x /tmp/cape-py312/bin/python
          cd /tmp/cape-upstream
          mkdir -p /tmp/cape-test-user
          chown nobody:nogroup /tmp/cape-test-user
          set +e
          runuser -u nobody -- env HOME=/tmp/cape-test-user \
            /tmp/cape-py312/bin/python -B /tmp/cape-upstream/cuckoo.py --help \
            > /tmp/cape-cli-help.out 2> /tmp/cape-cli-help.err
          cape_help_status=$?
          set -e
          echo "CAPE_REAL_CLI_IMPORT_STATUS=$cape_help_status"
          sed -n '1,35p' /tmp/cape-cli-help.err
          if [ "$cape_help_status" -ne 0 ]; then
            echo "CAPE_CLI_IMPORT_OR_OS_COMPATIBILITY_BLOCKED"
            exit "$cape_help_status"
          fi
          grep -E -- 'usage:|--help|Usage:' /tmp/cape-cli-help.out | head -n 6
          echo "CAPE_UNPRIVILEGED_PINNED_CLI_HELP_IMPORTED"
          python3 -B - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('/tmp/cape-py312')
          lock=Path('/tmp/cape-cp312-resolved.txt')
          source=Path('/tmp/cape-upstream')
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          packages=subprocess.run(
              ['/tmp/cape-uv-tool/bin/uv','pip','list',
               '--python',str(root/'bin/python'),'--format','json'],
              capture_output=True,text=True,check=True,timeout=45)
          items=json.loads(packages.stdout)
          assert len(items)>=160, len(items)
          digest={
            "upstream_git_sha":"004d73c51dcd12dacb97b3657262bdea8376d710",
            "python_runtime_version":"3.12.12",
            "system_python_untouched":"3.14.4",
            "uv_version":"0.9.15",
            "source_git_pyproject_sha256":sha(source/'pyproject.toml'),
            "resolved_hash_lock_sha256":sha(lock),
            "resolved_package_count":len(items),
            "installed_packages":items,
            "not_a_production_runtime_release":True,
            "no_windows_master_or_credentials_used":True
          }
          Path('/tmp/cape-runtime-attestation.json').write_text(
              json.dumps(digest,sort_keys=True,indent=2)+'\\n')
          print("CAPE_CI_RUNTIME_ATTESTED", len(items),
                digest["resolved_hash_lock_sha256"])
          PY
          echo "NOT_A_CAPE_SERVICE_OR_VM_ACCEPTANCE_TEST"
      - name: Save exact resolved hash lock and real Python package inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cape-py312-lock-and-installed-package-provenance
          path: |
            /tmp/cape-cp312-resolved.txt
            /tmp/cape-runtime-attestation.json
          if-no-files-found: warn
          retention-days: 14

