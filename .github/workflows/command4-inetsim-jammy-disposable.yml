name: Command4 INetSim Ubuntu22 signed distro package rehearsal
on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/command4-inetsim-jammy-disposable.yml"
      - "scripts/command4_inetsim_config_guard.py"
      - "scripts/test_command4_inetsim_config_guard.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inetsim-disposable:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rehearse official signed Jammy INetSim package without systemd or guests
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 22.04
          apt-get update -o APT::Get::Update::Error-Mode=any
          apt-cache policy inetsim | tee /tmp/inetsim-policy.txt
          grep -q 'Candidate: 1.3.2+dfsg.1-1build1' /tmp/inetsim-policy.txt
          apt-get -s install --no-install-recommends inetsim | tee /tmp/inetsim-apt-simulation.txt
          ! grep -Eq '^(Remv |Purg |Hold )' /tmp/inetsim-apt-simulation.txt
          apt-get install -y --no-install-recommends inetsim
          test -x /usr/bin/inetsim
          test -f /etc/inetsim/inetsim.conf
          test -f /etc/default/inetsim
          test -f /etc/init.d/inetsim
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' inetsim
          echo "INETSIM_DEFAULTS_BEGIN"
          sed -n '1,140p' /etc/default/inetsim
          echo "INETSIM_CONF_SAFE_BIND_OPTIONS"
          grep -E '^[[:space:]#]*(service_bind_address|dns_default_ip|service_run_as_user|start_service)' /etc/inetsim/inetsim.conf | head -n 35 || :
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_command4_inetsim_config_guard.py' -v
          python3 -B scripts/command4_inetsim_config_guard.py \
            --config /etc/inetsim/inetsim.conf --lab-ip 192.168.122.1
          test -f /etc/inetsim/inetsim.conf
          echo "COMMAND4_SIGNED_DISTRO_BINARIES_INSTALLED_IN_EPHEMERAL_CONTAINER_ONLY"
          echo "NO_INETSIM_SERVICE_STARTED_NO_HOST_NETWORK_CHANGED_NO_GUEST"
