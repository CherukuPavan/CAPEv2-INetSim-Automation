name: Build and reinstall CAPE Python3.12 wheelhouse fully offline

on:
  push:
    branches: [development]
    paths:
      - "scripts/ci_normalize_python_tlsh_wheel.py"
      - "scripts/test_ci_normalize_python_tlsh_wheel.py"
      - "scripts/command1_cape_runtime_offline_admission.py"
      - "scripts/command1_cape_runtime_rootless_stage.py"
      - ".github/workflows/command1-cape-py312-offline-wheelhouse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-offline-wheelhouse:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Produce reviewed platform-specific Python wheelhouse from pinned CAPE metadata
        env:
          DEBIAN_FRONTEND: noninteractive
          UPSTREAM_REV: 004d73c51dcd12dacb97b3657262bdea8376d710
          UV_PYTHON_INSTALL_DIR: /tmp/cape-python-versions
          UV_PYTHON_INSTALL_BIN: "0"
          UV_NO_CACHE: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          # Fixed build epoch eliminates time-dependent ZIP metadata for
          # locally built CAPE SDist wheels. No floating install versions.
          SOURCE_DATE_EPOCH: "1700000000"
          PYTHONHASHSEED: "0"
          TZ: UTC
          LC_ALL: C.UTF-8
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 26.04
          apt-get update -o APT::Get::Update::Error-Mode=any
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git ca-certificates \
            build-essential cmake pkg-config libssl-dev libffi-dev \
            zlib1g-dev libjpeg-dev libmagic-dev libfuzzy-dev \
            libyara-dev libpq-dev libxml2-dev libxslt1-dev
          python3 -m venv /tmp/cape-uv-tool
          /tmp/cape-uv-tool/bin/python -m pip install --only-binary=:all: "uv==0.9.15"
          /tmp/cape-uv-tool/bin/uv python install "3.12.12" --no-bin
          /tmp/cape-uv-tool/bin/uv venv --managed-python --seed \
              --python "3.12.12" /tmp/cape-build
          git clone -q --filter=blob:none --no-checkout \
              https://github.com/kevoreilly/CAPEv2.git /tmp/cape-upstream
          git -C /tmp/cape-upstream checkout -q --detach "$UPSTREAM_REV"
          test "$(git -C /tmp/cape-upstream rev-parse HEAD)" = "$UPSTREAM_REV"
          /tmp/cape-uv-tool/bin/uv pip compile \
            --python /tmp/cape-build/bin/python \
            --generate-hashes \
            --output-file /tmp/cape-hashed-source-deps.txt \
            /tmp/cape-upstream/pyproject.toml
          mkdir -p /tmp/cape-built-wheels
          # Source distribution build hooks run ONLY in this disposable
          # credential-free CI container, never as CAPE service/root on host.
          /tmp/cape-build/bin/python -m pip wheel \
            --no-cache-dir \
            --require-hashes \
            --wheel-dir /tmp/cape-built-wheels \
            --requirement /tmp/cape-hashed-source-deps.txt
          mkdir -p /tmp/cape-replayed-wheels
          /tmp/cape-build/bin/python -m pip wheel \
            --no-cache-dir \
            --require-hashes \
            --wheel-dir /tmp/cape-replayed-wheels \
            --requirement /tmp/cape-hashed-source-deps.txt
          # The sole volatile native dependency, python-tlsh==4.5.0,
          # embeds random /tmp/pip-wheel-* absolute paths in DWARF and
          # consequently has a differing GNU build-ID. Keep both original
          # signed-sdist attestations; remove debug/build-ID sections ONLY
          # from this wheel, update PEP427 RECORD and prove both independent
          # normalized outputs have identical SHA256 before locking.
          test -x /usr/bin/objcopy
          python3 -B scripts/ci_normalize_python_tlsh_wheel.py \
            /tmp/cape-built-wheels/python_tlsh-4.5.0-cp312-cp312-linux_x86_64.whl \
            /tmp/cape-replayed-wheels/python_tlsh-4.5.0-cp312-cp312-linux_x86_64.whl
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib
          def digests(path):
              return {
                p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                for p in Path(path).glob('*.whl')
              }
          a=digests('/tmp/cape-built-wheels')
          b=digests('/tmp/cape-replayed-wheels')
          assert len(a)>=160 and a.keys()==b.keys(), (len(a),len(b))
          changed=sorted(name for name in a if a[name]!=b[name])
          print("CAPE_TWICE_BUILT_WHEEL_DIFF_COUNT",len(changed))
          for name in changed:
              print("DIFFERENT_WHEEL_HASH",name)
              from zipfile import ZipFile
              left=Path('/tmp/cape-built-wheels')/name
              right=Path('/tmp/cape-replayed-wheels')/name
              with ZipFile(left) as a_zip, ZipFile(right) as b_zip:
                  a_names=set(a_zip.namelist())
                  b_names=set(b_zip.namelist())
                  print("ZIP_MEMBER_NAME_DIFFERENCE",sorted(a_names^b_names)[:20])
                  for item in sorted(a_names & b_names):
                      da=hashlib.sha256(a_zip.read(item)).hexdigest()
                      db=hashlib.sha256(b_zip.read(item)).hexdigest()
                      if da!=db:
                          print("ZIP_MEMBER_BYTES_DIFFER",item,da,db,
                                len(a_zip.read(item)),len(b_zip.read(item)))
          assert not changed, "Wheel files must be bit-reproducible in one reviewed build"
          print("CAPE_170_WHEELS_REBUILT_WITH_IDENTICAL_SHA256")
          PY
          /tmp/cape-build/bin/python - <<'PY'
          from pathlib import Path
          from pip._vendor.packaging.utils import parse_wheel_filename
          import hashlib, json
          wheels=sorted(Path('/tmp/cape-built-wheels').glob('*.whl'))
          assert len(wheels)>=160, len(wheels)
          records={}
          for path in wheels:
              name,version,build,tags=parse_wheel_filename(path.name)
              name=str(name).lower()
              assert name not in records, "Multiple platform versions: "+name
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              records[name]={"version":str(version),"wheel":path.name,
                             "size":path.stat().st_size,"sha256":digest}
          assert 'gevent' in records and 'greenlet' in records
          assert records['gevent']['version']=='24.2.1'
          assert records['greenlet']['version']=='3.0.3'
          lock=Path('/tmp/cape-offline-wheels-hash.lock')
          lock.write_text(''.join(
              f"{name}=={data['version']} --hash=sha256:{data['sha256']}\n"
              for name,data in sorted(records.items())))
          manifest={
             "source_commit":"004d73c51dcd12dacb97b3657262bdea8376d710",
             "python_version":"3.12.12",
             "uv_build_version":"0.9.15",
             "platform":"ubuntu-26.04-amd64",
             "wheel_count":len(wheels),
             "total_wheel_bytes":sum(p.stat().st_size for p in wheels),
             "lock_sha256":hashlib.sha256(lock.read_bytes()).hexdigest(),
             "wheels":records,
             "not_an_approved_host_installer":True
          }
          Path('/tmp/cape-wheel-manifest.json').write_text(
              json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print("OFFLINE_WHEELHOUSE_LOCKED",len(wheels),manifest["lock_sha256"])
          PY
      - name: Validate every actual binary wheel and hash lock with the deployment admission parser
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          # The hash is computed here only to exercise the read-only
          # validator. A production target MUST independently pin an
          # approved manifest hash, not trust a downloaded file itself.
          synthetic_review_hash="$(sha256sum /tmp/cape-wheel-manifest.json | cut -d ' ' -f1)"
          python3 -B scripts/command1_cape_runtime_offline_admission.py \
            --manifest /tmp/cape-wheel-manifest.json \
            --lock /tmp/cape-offline-wheels-hash.lock \
            --wheelhouse /tmp/cape-built-wheels \
            --approved-manifest-sha256 "$synthetic_review_hash"
          echo "CAPE_170_REAL_WHEELS_AND_LOCK_PASSED_FULL_BYTE_ADMISSION"
      - name: Preserve only differing native wheel builds for byte-level reproducibility diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cape-python-tlsh-differing-native-wheels
          path: |
            /tmp/cape-built-wheels/python_tlsh-*.whl
            /tmp/cape-replayed-wheels/python_tlsh-*.whl
          if-no-files-found: warn
          retention-days: 3
      - name: Check real 170-wheel approved assets cannot be replaced by CAPE runtime user
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          # /tmp is intentionally not protected and is forbidden for a real
          # operator install. Place exact wheel artifacts in a root-owned
          # secure staging directory before giving CAPE a read-only view.
          install -d -m 0755 /opt/cape-reviewed-python
          install -d -m 0755 /opt/cape-reviewed-python/wheels
          install -d -m 0755 /opt/cape-reviewed-python/source
          install -d -m 0755 /opt/cape-reviewed-python/bin
          install -m 0644 /tmp/cape-wheel-manifest.json \
            /opt/cape-reviewed-python/manifest.json
          install -m 0644 /tmp/cape-offline-wheels-hash.lock \
            /opt/cape-reviewed-python/lock.txt
          install -m 0755 /tmp/cape-uv-tool/bin/uv \
            /opt/cape-reviewed-python/bin/uv
          find /tmp/cape-built-wheels -maxdepth 1 -type f -name '*.whl' \
            -exec install -m 0644 -t /opt/cape-reviewed-python/wheels '{}' +
          test "$(find /opt/cape-reviewed-python/wheels -type f | wc -l)" = 170
          python3 -B - <<'PY'
          from pathlib import Path
          from command1_cape_runtime_rootless_stage import (
              verify_root_immutable_inputs, RuntimeBlocked)
          root=Path('/opt/cape-reviewed-python')
          params=dict(
              manifest=root/'manifest.json',lock=root/'lock.txt',
              wheelhouse=root/'wheels',uv=root/'bin/uv',
              python=Path('/usr/bin/python3.14'),
              cape_source=root/'source'
          )
          out=verify_root_immutable_inputs(**params)
          assert out['immutable_root_owned_wheels_verified']==170
          print('REAL_170_ROOT_OWNED_IMMUTABLE_RUNTIME_WHEELS_ACCEPTED')
          candidate=next((root/'wheels').glob('*.whl'))
          candidate.chmod(0o666)
          try:
              verify_root_immutable_inputs(**params)
              raise AssertionError('Writability must block execution')
          except RuntimeBlocked as exc:
              assert 'not root-owned' in str(exc), str(exc)
          finally:
              candidate.chmod(0o644)
          print('RUNTIME_USER_WRITABLE_WHEEL_BLOCKED_PREEXECUTION')
          PY
      - name: Fresh isolated Python 3.12 can install and execute pinned CAPE dependency CLI with NO network
        env:
          UV_NO_CACHE: "1"
          PIP_NO_INDEX: "1"
        shell: bash
        run: |
          set -Eeuo pipefail
          /tmp/cape-uv-tool/bin/uv venv --managed-python --seed \
            --python "3.12.12" /tmp/cape-fully-offline
          /tmp/cape-fully-offline/bin/python -m pip install \
            --no-index --no-deps --only-binary=:all: --require-hashes \
            --find-links=/tmp/cape-built-wheels \
            --requirement /tmp/cape-offline-wheels-hash.lock
          /tmp/cape-fully-offline/bin/python - <<'PY'
          import gevent,greenlet,django,sqlalchemy,yara,sys
          assert sys.version_info[:2] == (3,12)
          assert gevent.__version__=='24.2.1'
          assert greenlet.__version__=='3.0.3'
          print("CAPE_OFFLINE_NATIVE_PACKAGES_IMPORT_SUCCESS")
          PY
          mkdir -p /tmp/cape-cli-test
          chown nobody:nogroup /tmp/cape-cli-test
          cd /tmp/cape-upstream
          runuser -u nobody -- env HOME=/tmp/cape-cli-test \
            /tmp/cape-fully-offline/bin/python -B \
            /tmp/cape-upstream/cuckoo.py --help >/tmp/cape-offline-help
          grep -q -- '--help' /tmp/cape-offline-help
          test "$(python3 --version)" = "Python 3.14.4"
          echo "CAPE_PINNED_UNPRIVILEGED_CLI_HELP_SUCCEEDED_WITH_OFFLINE_WHEELS"
          # This second fresh venv has neither pip nor an online installer.
          # It verifies the offline 'uv venv' + 'uv pip install' sequence
          # reusable by an unprivileged Command1 runtime substage.
          /tmp/cape-uv-tool/bin/uv venv --offline \
            --python /tmp/cape-build/bin/python \
            /tmp/cape-uv-offline
          UV_NO_CACHE=1 /tmp/cape-uv-tool/bin/uv pip install \
            --offline --python /tmp/cape-uv-offline/bin/python \
            --no-index --no-deps --require-hashes \
            --find-links /tmp/cape-built-wheels \
            --requirement /tmp/cape-offline-wheels-hash.lock
          /tmp/cape-uv-offline/bin/python - <<'PY'
          import sys, gevent, greenlet, django, sqlalchemy, yara
          assert sys.version_info[:2] == (3,12)
          assert gevent.__version__=='24.2.1'
          assert greenlet.__version__=='3.0.3'
          print("CAPE_OFFLINE_UV_NO_PIP_FRESH_RUNTIME_INSTALLED")
          PY
      - name: Preserve SHA256 manifest and strict offline lock for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cape-ubuntu26-py312-offline-wheelhouse-manifest
          path: |
            /tmp/cape-wheel-manifest.json
            /tmp/cape-offline-wheels-hash.lock
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve disposable platform wheelhouse for manual binary provenance review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cape-ubuntu26-py312-wheels-temporary-review
          path: /tmp/cape-built-wheels/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
