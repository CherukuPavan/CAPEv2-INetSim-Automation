name: Complete repository structural and recovery offline audit

on:
  push:
    branches: [development]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-source-parse:
    name: Repository-wide syntax and recovery tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse every tracked Python Bash PowerShell YAML and Markdown file
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python scripts/repository_static_preflight.py
      - name: Recovery and worldwide private reader security unit tests
        run: |
          PYTHONPATH=scripts python -m unittest -v \
            test_command123_repair_rollback \
            test_command123_repair_doctor \
            test_command1_worldwide_drive_reader
      - name: Full Python syntax tree compilation
        run: |
          python -m compileall -q scripts
