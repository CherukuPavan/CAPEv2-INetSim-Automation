name: Three-command integrated offline regression

on:
  push:
    branches: [development]
    paths:
      - "scripts/ci_normalize_python_tlsh_wheel.py"
      - "scripts/test_ci_normalize_python_tlsh_wheel.py"
      - "scripts/command1_*.py"
      - "scripts/command2_*.py"
      - "scripts/command3_*.py"
      - "scripts/command123_*.py"
      - "scripts/test_command1_*.py"
      - "scripts/test_command2_*.py"
      - "scripts/test_command3_*.py"
      - "scripts/test_command123_*.py"
      - "scripts/bootstrap_pre_vm_prereqs.sh"
      - "scripts/test_bootstrap_pre_vm_prereqs_txn.py"
      - "scripts/private_repo_checkout_preflight.py"
      - "scripts/test_private_repo_checkout_preflight.py"
      - ".github/workflows/three-command-integrated-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-python-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python 3.10 TOML standard-library backport
        if: matrix.python-version == '3.10'
        run: python -B -m pip install 'tomli>=2,<3'
      - name: Compile all automation Python modules without bytecode writes
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import ast
          count=0
          for path in sorted(Path("scripts").glob("*.py")):
              ast.parse(path.read_text(encoding="utf-8"),filename=str(path))
              count+=1
          print("PYTHON_SOURCE_SYNTAX_PASS",count)
          PY
      - name: Run every synthetic Python regression against joined architecture
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          python -B -m unittest discover -s scripts -p 'test_*.py' -q 2>&1 | tee "$RUNNER_TEMP/cape-offline-failure.log"
      - name: Save sanitized synthetic regression failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-failure-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/cape-offline-failure.log
          if-no-files-found: ignore
          retention-days: 2
      - name: Guarantee protected reference and latest master stay out of artifact
        run: |
          python -B - <<'PY'
          from pathlib import Path
          forbidden_extensions={".qcow2",".vhd",".vmdk",".iso",".p12",".key",".pem",".pfx",".fd",".nvram",".tpm",".swtpm"}
          files=list(Path(".").rglob("*"))
          forbidden=[str(f) for f in files if f.is_file()
                     and (f.suffix.lower() in forbidden_extensions
                          or f.name in ("rclone.conf","cape_world_readonly.conf")
                          or ("service-account" in f.name.lower() and f.suffix == ".json")
                          or ("service_account" in f.name.lower() and f.suffix == ".json"))]
          assert not forbidden, forbidden
          print("NO_GOLDEN_DISKS_ISOS_OR_CREDENTIAL_FILES_COMMITTED")
          PY
