name: Command 3 CAPE configuration offline checks

on:
  push:
    branches: [development]
    paths:
      - "scripts/command3_*.py"
      - "scripts/test_command3_*.py"
      - "docs/COMMAND3_*.md"
      - ".github/workflows/command3-config-offline.yml"
  pull_request:
    branches: [development]
    paths:
      - "scripts/command3_*.py"
      - "scripts/test_command3_*.py"
      - ".github/workflows/command3-config-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-config:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile reviewed Command3 Python source without modifying host
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for entry in sorted(Path("scripts").glob("*command3*.py")):
              ast.parse(entry.read_text(encoding="utf-8"), filename=str(entry))
              print("SYNTAX_OK", entry)
          PY
      - name: Run synthetic-only configuration tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest discover -s scripts -p 'test_command3_*.py' -v
      - name: Assert no automatic CAPE service restart and no generic commands
        run: |
          python -B - <<'PY'
          from pathlib import Path
          script = Path("scripts/command3_cape_api_ratelimit.py").read_text()
          for dangerous in ("shell=True", "systemctl restart", "sudo service",
                            "subprocess.run(", '"virsh"', "'virsh'"):
              assert dangerous not in script, dangerous
          print("NO_SERVICE_RESTART_AND_NO_VM_MUTATION_PASS")
          PY
