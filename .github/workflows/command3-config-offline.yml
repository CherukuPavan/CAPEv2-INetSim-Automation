name: Command 3 CAPE configuration offline checks

on:
  push:
    branches: [development]
    paths:
      - "scripts/command3_*.py"
      - "scripts/test_command3_*.py"
      - "docs/COMMAND3_*.md"
      - ".github/workflows/command3-config-offline.yml"
  pull_request:
    branches: [development]
    paths:
      - "scripts/command3_*.py"
      - "scripts/test_command3_*.py"
      - ".github/workflows/command3-config-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-config:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile reviewed Command3 Python source without modifying host
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for entry in sorted(Path("scripts").glob("*command3*.py")):
              ast.parse(entry.read_text(encoding="utf-8"), filename=str(entry))
              print("SYNTAX_OK", entry)
          PY
      - name: Run synthetic-only configuration tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest discover -s scripts -p 'test_command3_*.py' -v
      - name: Verify config editors cannot restart and standalone restarter has fixed units
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          special = Path("scripts/command3_cape_restart_verified.py")
          assert special.is_file()
          reviewed = sorted(Path("scripts").glob("command3_cape_*.py"))
          reviewed = [file for file in reviewed if file != special]
          reviewed.append(Path("scripts/command3_from_operator_reference.py"))
          assert all(p.is_file() for p in reviewed)
          for file in reviewed:
              script = file.read_text(encoding="utf-8")
              for dangerous in ("shell=True", "systemctl restart",
                                "sudo service", "subprocess.run(",
                                '"virsh"', "'virsh'"):
                  assert dangerous not in script, (str(file), dangerous)
          tree = ast.parse(special.read_text(encoding="utf-8"))
          funcs = {node.name:node for node in tree.body
                   if isinstance(node, (ast.FunctionDef,ast.AsyncFunctionDef))}
          assert "restart_exact" in funcs and "apply" in funcs
          run_calls=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute):
                  if (isinstance(node.func.value,ast.Name) and
                      node.func.value.id=="subprocess" and node.func.attr=="run"):
                      run_calls.append(node)
          assert len(run_calls)==1
          assert any(call in ast.walk(funcs["restart_exact"]) for call in run_calls)
          assert '"systemctl","restart",unit' in special.read_text()
          assert "need(unit in UNITS" in special.read_text()
          for banned in ("shell=True","os.system(","subprocess.Popen(",
                         '"virsh"','"apt-get"'):
              assert banned not in special.read_text(), banned
          print("CONFIG_NO_RESTART_AND_EXACT_STANDALONE_SERVICE_RESTART_PASS")
          PY
