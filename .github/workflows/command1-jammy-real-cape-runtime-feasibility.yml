name: Exact CAPEv2 Python runtime feasibility on user's Ubuntu 22.04
on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/command1-jammy-real-cape-runtime-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jammy-cape-py312:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and run exact user-source CAPE Python runtime on disposable Jammy container
        env:
          DEBIAN_FRONTEND: noninteractive
          UV_NO_CACHE: "1"
          UV_PYTHON_INSTALL_DIR: /tmp/cape-pyversions
          UV_PYTHON_INSTALL_BIN: "0"
          SOURCE_DATE_EPOCH: "1700000000"
          CAPE_SOURCE_REV: 297bbbcc15386e903734cec8f8a7c805053d6d0c
        shell: bash
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 22.04
          apt-get update -o APT::Get::Update::Error-Mode=any
          apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip git ca-certificates \
            build-essential cmake pkg-config libssl-dev libffi-dev \
            zlib1g-dev libjpeg-dev libmagic-dev libfuzzy-dev \
            libyara-dev libpq-dev libxml2-dev libxslt1-dev
          python3 -m venv /tmp/cape-uv-tool
          /tmp/cape-uv-tool/bin/python -m pip install --no-cache-dir --only-binary=:all: uv==0.9.15
          /tmp/cape-uv-tool/bin/uv python install 3.12.12 --no-bin
          /tmp/cape-uv-tool/bin/uv venv --managed-python --seed --python 3.12.12 /tmp/cape-py312
          git clone -q --no-checkout --filter=blob:none https://github.com/kevoreilly/CAPEv2.git /tmp/cape-upstream
          git -C /tmp/cape-upstream -c maintenance.auto=false -c gc.auto=0 checkout -q --detach "$CAPE_SOURCE_REV"
          test "$(git -C /tmp/cape-upstream rev-parse HEAD)" = "$CAPE_SOURCE_REV"
          /tmp/cape-uv-tool/bin/uv pip compile \
            --python /tmp/cape-py312/bin/python --generate-hashes \
            --output-file /tmp/cape-jammy-lock.txt \
            /tmp/cape-upstream/pyproject.toml
          mkdir -p /tmp/cape-jammy-wheels
          /tmp/cape-py312/bin/python -m pip wheel \
            --no-cache-dir --require-hashes --wheel-dir /tmp/cape-jammy-wheels \
            --requirement /tmp/cape-jammy-lock.txt
          count="$(find /tmp/cape-jammy-wheels -maxdepth 1 -type f -name '*.whl' | wc -l)"
          test "$count" -ge 160
          # uv compile hashes the DISTRIBUTIONS available on the index.
          # Local builds necessarily have different wheel hashes. Generate a
          # second exact offline INSTALL lock over the built wheel bytes.
          /tmp/cape-py312/bin/python - <<'PY'
          from pathlib import Path
          from pip._vendor.packaging.utils import parse_wheel_filename
          import hashlib
          root=Path('/tmp/cape-jammy-wheels')
          records={}
          for f in sorted(root.glob('*.whl')):
              name,version,_,_=parse_wheel_filename(f.name)
              name=str(name).lower()
              assert name not in records,name
              records[name]=(str(version),hashlib.sha256(f.read_bytes()).hexdigest())
          assert len(records)>=160,len(records)
          Path('/tmp/cape-jammy-built-hash.lock').write_text(
              ''.join(f'{name}=={version} --hash=sha256:{digest}\n'
                      for name,(version,digest) in sorted(records.items())))
          print('JAMMY_BUILD_WHEEL_SHA256_LOCK_CREATED',len(records))
          PY
          /tmp/cape-py312/bin/python -m pip install \
            --no-index --no-deps --only-binary=:all: --require-hashes \
            --find-links=/tmp/cape-jammy-wheels \
            --requirement /tmp/cape-jammy-built-hash.lock
          /tmp/cape-py312/bin/python - <<'PY'
          import sys,gevent,greenlet,django,sqlalchemy,yara
          assert sys.version_info[:3] == (3,12,12),sys.version
          print('JAMMY_EXACT_CAPE_PY312_CORE_PACKAGES_IMPORT_OK')
          PY
          install -d -m 0755 /tmp/cape-runtime-probe
          chown nobody:nogroup /tmp/cape-runtime-probe
          cd /tmp/cape-upstream
          runuser -u nobody -- env HOME=/tmp/cape-runtime-probe \
            /tmp/cape-py312/bin/python -B /tmp/cape-upstream/cuckoo.py --help \
            > /tmp/cape-jammy-help.txt
          grep -q -- '--help' /tmp/cape-jammy-help.txt
          echo "JAMMY_EXACT_PINNED_CAPEV2_PY312_CLI_SUCCESS_WHEELS=$count"
          echo "NO_CAPE_SYSTEMD_LIBVIRT_SNAPSHOTS_INSTALLED_OR_TESTED"
      - name: Attest exact Jammy runtime wheels and preserve reviewable bytes
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          /tmp/cape-py312/bin/python - <<'PY'
          from pathlib import Path
          from pip._vendor.packaging.utils import parse_wheel_filename
          import hashlib,json
          root=Path('/tmp/cape-jammy-wheels')
          wheel_files=sorted(root.glob('*.whl'))
          assert len(wheel_files)>=160
          packages={}
          for path in wheel_files:
              name,ver,_,_=parse_wheel_filename(path.name)
              name=str(name).lower()
              assert name not in packages,name
              packages[name]={
                  'version':str(ver), 'wheel':path.name,
                  'size':path.stat().st_size,
                  'sha256':hashlib.sha256(path.read_bytes()).hexdigest()
              }
          lock=Path('/tmp/cape-jammy-built-hash.lock')
          payload={
              'source_commit':'297bbbcc15386e903734cec8f8a7c805053d6d0c',
              'platform':'ubuntu-22.04-amd64',
              'python_version':'3.12.12','uv_build_version':'0.9.15',
              'wheel_count':len(packages),
              'total_wheel_bytes':sum(v['size'] for v in packages.values()),
              'lock_sha256':hashlib.sha256(lock.read_bytes()).hexdigest(),
              'wheels':packages,
              'not_an_approved_host_installer':True,
          }
          meta=Path('/tmp/cape-jammy-wheel-manifest.json')
          meta.write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          print('JAMMY_SOURCE297_WHEELS',len(packages))
          print('JAMMY_SOURCE297_MANIFEST_SHA256',hashlib.sha256(meta.read_bytes()).hexdigest())
          PY
          sha256sum /tmp/cape-jammy-wheel-manifest.json /tmp/cape-jammy-built-hash.lock
      - name: Preserve Jammy SHA256 manifest and offline install lock
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cape-source297-jammy-python312-wheel-manifest
          path: |
            /tmp/cape-jammy-wheel-manifest.json
            /tmp/cape-jammy-built-hash.lock
          if-no-files-found: error
          retention-days: 90
      - name: Preserve Jammy verified wheelhouse for offline target admission
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cape-source297-jammy-python312-wheels
          path: /tmp/cape-jammy-wheels/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve pinned dependency report for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cape-source297-jammy-py312-dependency-lock
          path: |
            /tmp/cape-jammy-lock.txt
            /tmp/cape-jammy-built-hash.lock
          if-no-files-found: warn
          retention-days: 14
