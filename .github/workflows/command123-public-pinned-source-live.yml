name: Credential-free pinned public source acquisition

on:
  push:
    branches: [development]
    paths:
      - "scripts/command123_private_pinned_checkout.py"
      - "scripts/command123_emit_public_bootstrap.py"
      - "scripts/test_command123_private_pinned_checkout.py"
      - "scripts/test_command123_emit_public_bootstrap.py"
      - ".github/workflows/command123-public-pinned-source-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-public-github-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain exact public repository commit without auth or Git
        env:
          COMMIT_SHA: ${{ github.sha }}
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import os
          from command123_private_pinned_checkout import acquire
          revision = os.environ["COMMIT_SHA"]
          root = acquire(revision, None, Path.home())
          assert root.name == revision
          for path in (
              "scripts/command123_emit_public_bootstrap.py",
              "scripts/command123_private_pinned_checkout.py",
              "scripts/command1_import_existing_master.py"):
              downloaded = (root / path).read_bytes()
              checked_out = Path(path).read_bytes()
              assert downloaded == checked_out, path
          print("PUBLIC_EXACT_COMMIT_GIT_BLOBS_VERIFIED_NO_TOKEN")
          PY
      - name: Do not bundle credentials, Windows master or TPM
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          home=Path.home()/".local"/"share"/"cape-three-command"
          forbidden=(".qcow2",".p12",".key",".pfx",".nvram",".tpm",".iso")
          evidence=[p for p in home.rglob("*") if p.is_file()
                    and (p.suffix.lower() in forbidden or p.name=="rclone.conf")]
          assert not evidence, evidence
          print("NO_GOLDEN_DISKS_OR_PRIVATE_CREDENTIAL_FILES")
          PY
